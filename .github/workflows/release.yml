name: Build release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    # Manual runs produce uploaded workflow artifacts only (no GitHub Release).

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (M1/M2/M3/…). `macos-latest` is ARM64 on current images.
          - os: macos-latest
            asset_suffix: macos-arm64
            rustflags: ""
          # Intel Mac (x86_64). Use GitHub’s `macos-15-intel` image (see actions/runner-images).
          - os: macos-15-intel
            asset_suffix: macos-intel
            rustflags: ""
          - os: windows-latest
            asset_suffix: windows-x64
            # `cargo install pyapp` does not reliably pick up repo `.cargo/config.toml`; set explicitly
            # so PyApp.exe does not require VCRUNTIME140.dll on end-user machines.
            rustflags: "-C target-feature=+crt-static"
    runs-on: ${{ matrix.os }}

    env:
      PYAPP_EXEC_SPEC: "anki_image_updater:start_app"
      PYAPP_PYTHON_VERSION: "3.12"
      PYAPP_FULL_ISOLATION: "true"
      PYAPP_PIP_EXTERNAL: "true"
      RUSTFLAGS: ${{ matrix.rustflags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: uv build --wheel

      # PyApp embeds the wheel at `cargo install pyapp` time. If PYAPP_PROJECT_PATH is empty or wrong,
      # the binary runs but fails with ModuleNotFoundError for anki_image_updater.
      - name: Record wheel path (Unix)
        if: runner.os != 'Windows'
        run: |
          shopt -s nullglob
          wheels=( "$GITHUB_WORKSPACE"/dist/anki_image_updater-*-py3-none-any.whl )
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "Expected exactly one .whl in dist/; found ${#wheels[@]}" >&2
            ls -la "$GITHUB_WORKSPACE/dist" >&2 || true
            exit 1
          fi
          echo "PYAPP_PROJECT_PATH=${wheels[0]}" >> "$GITHUB_ENV"
          echo "Using wheel: ${wheels[0]}"

      - name: Record wheel path (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wheels = @(Get-ChildItem -Path "$env:GITHUB_WORKSPACE\dist\anki_image_updater-*-py3-none-any.whl" -ErrorAction SilentlyContinue)
          if ($wheels.Count -ne 1) {
            throw "Expected exactly one .whl in dist/; found $($wheels.Count)"
          }
          $wheel = $wheels[0].FullName
          echo "PYAPP_PROJECT_PATH=$wheel" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using wheel: $wheel"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-pyapp-${{ hashFiles('.cargo/config.toml', '.github/workflows/release.yml', 'scripts/package_macos_app.sh', 'scripts/generate_macos_icon.sh', 'scripts/generate_windows_icon.py', 'packaging/macos/Info.plist.in', 'packaging/macos/launcher/main.swift', 'packaging/macos/AppIcon.icns', 'packaging/macos/anki-image-updater-icon.png', 'packaging/windows/AppIcon.ico', 'packaging/windows/launcher-rust/Cargo.toml', 'packaging/windows/launcher-rust/Cargo.lock', 'packaging/windows/launcher-rust/src/main.rs') }}
          restore-keys: ${{ runner.os }}-cargo-pyapp-

      - name: Build PyApp bootstrapper
        run: cargo install pyapp --force --root dist-bin

      - name: Rename PyApp binary
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist-bin/bin/pyapp.exe dist-bin/bin/AnkiImageUpdaterPyApp.exe
          else
            mv dist-bin/bin/pyapp "dist-bin/bin/AnkiImageUpdater-${{ matrix.asset_suffix }}"
          fi

      - name: Install Rust (Windows launcher)
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@stable

      # Rust + egui micro-loader (~few MB): embeds PyApp bytes; no .NET on end users.
      - name: Build Windows launcher (Rust)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RCEDIT_URL: https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe
        run: |
          $ico = Join-Path $env:GITHUB_WORKSPACE "packaging/windows/AppIcon.ico"
          if (-not (Test-Path $ico)) { throw "Missing $ico — run: uv run --with pillow python scripts/generate_windows_icon.py" }
          $assets = Join-Path $env:GITHUB_WORKSPACE "packaging/windows/launcher-rust/assets"
          New-Item -ItemType Directory -Force -Path $assets | Out-Null
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "dist-bin/bin/AnkiImageUpdaterPyApp.exe") (Join-Path $assets "AnkiImageUpdaterPyApp.exe") -Force
          Push-Location (Join-Path $env:GITHUB_WORKSPACE "packaging/windows/launcher-rust")
          try {
            cargo build --release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
          $exe = Join-Path $env:GITHUB_WORKSPACE "dist-bin/AnkiImageUpdater-windows-x64.exe"
          $built = Join-Path $env:GITHUB_WORKSPACE "packaging/windows/launcher-rust/target/release/AnkiImageUpdater.exe"
          Copy-Item $built $exe -Force
          $sz = (Get-Item $exe).Length
          $min = 3MB
          if ($sz -lt $min) {
            throw "Launcher exe is only $sz bytes (expected at least ~$min with embedded PyApp)."
          }
          $rcedit = Join-Path $env:RUNNER_TEMP "rcedit-x64.exe"
          $url = $env:RCEDIT_URL
          # GitHub release CDN sometimes returns 504; curl --retry handles flakes better than a single IWR.
          & curl.exe -fsSL --retry 8 --retry-delay 10 --connect-timeout 60 --max-time 300 -o $rcedit $url
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "curl.exe failed ($LASTEXITCODE); retrying with Invoke-WebRequest"
            $downloaded = $false
            for ($i = 1; $i -le 6 -and -not $downloaded; $i++) {
              try {
                Invoke-WebRequest -Uri $url -OutFile $rcedit -UseBasicParsing -TimeoutSec 300
                $downloaded = $true
              } catch {
                Write-Warning "Invoke-WebRequest attempt $i : $_"
                Start-Sleep -Seconds (10 * $i)
              }
            }
            if (-not $downloaded) { throw "Failed to download rcedit after retries (504/timeouts are common on GitHub releases — re-run the workflow)." }
          }
          if ((Get-Item $rcedit).Length -lt 1024) { throw "rcedit download looks corrupt or empty" }
          & $rcedit $exe --set-icon $ico
          "ASSET_PATH=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Ship a real .app bundle (double-click works like other Mac apps). The zip expands to
      # "Anki Image Updater.app" — drag it to Applications or run in place.
      - name: Package macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          "$GITHUB_WORKSPACE/scripts/package_macos_app.sh" \
            "$GITHUB_WORKSPACE/dist-bin/bin/AnkiImageUpdater-${{ matrix.asset_suffix }}" \
            "$GITHUB_WORKSPACE/dist-bin/AnkiImageUpdater-${{ matrix.asset_suffix }}.zip"
          echo "ASSET_PATH=$GITHUB_WORKSPACE/dist-bin/AnkiImageUpdater-${{ matrix.asset_suffix }}.zip" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnkiImageUpdater-${{ matrix.asset_suffix }}
          path: ${{ env.ASSET_PATH }}

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET_PATH }}
          draft: false
          prerelease: false
          generate_release_notes: true
