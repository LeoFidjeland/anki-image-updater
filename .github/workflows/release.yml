name: Build release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    # Manual runs produce uploaded workflow artifacts only (no GitHub Release).

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (M1/M2/M3/…). `macos-latest` is ARM64 on current images.
          - os: macos-latest
            asset_suffix: macos-arm64
            exe_suffix: ""
          # Intel Mac (x86_64). Use GitHub’s `macos-15-intel` image (see actions/runner-images).
          - os: macos-15-intel
            asset_suffix: macos-intel
            exe_suffix: ""
          - os: windows-latest
            asset_suffix: windows-x64
            exe_suffix: ".exe"
    runs-on: ${{ matrix.os }}

    env:
      PYAPP_EXEC_SPEC: "anki_image_updater:start_app"
      PYAPP_PYTHON_VERSION: "3.12"
      PYAPP_FULL_ISOLATION: "true"
      PYAPP_PIP_EXTERNAL: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: uv build --wheel

      - name: Record wheel path (Unix)
        if: runner.os != 'Windows'
        run: echo "PYAPP_PROJECT_PATH=$(ls $GITHUB_WORKSPACE/dist/anki_image_updater-*-py3-none-any.whl)" >> "$GITHUB_ENV"

      - name: Record wheel path (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem -Path "$env:GITHUB_WORKSPACE\dist\anki_image_updater-*-py3-none-any.whl" | Select-Object -First 1).FullName
          echo "PYAPP_PROJECT_PATH=$wheel" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-pyapp-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: ${{ runner.os }}-cargo-pyapp-

      - name: Build PyApp bootstrapper
        run: cargo install pyapp --force --root dist-bin

      - name: Rename binary
        shell: bash
        run: |
          src="dist-bin/bin/pyapp${{ matrix.exe_suffix }}"
          dst="dist-bin/bin/AnkiImageUpdater-${{ matrix.asset_suffix }}${{ matrix.exe_suffix }}"
          mv "$src" "$dst"
          echo "ASSET_PATH=$dst" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnkiImageUpdater-${{ matrix.asset_suffix }}
          path: ${{ env.ASSET_PATH }}

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET_PATH }}
          draft: false
          prerelease: false
          generate_release_notes: true
