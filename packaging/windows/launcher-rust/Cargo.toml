[package]
name = "anki-image-updater-windows-launcher"
version = "0.1.0"
edition = "2021"
description = "Tiny Win32 bootstrap: embeds PyApp, materializes + optional self restore, spawns PyApp in its own console."
publish = false

[build-dependencies]
winres = "0.1"

[[bin]]
name = "AnkiImageUpdater"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
sha2 = "0.10"
anyhow = "1.0"
msgbox = "0.7"
