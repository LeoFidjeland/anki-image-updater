[package]
name = "anki-image-updater-windows-launcher"
version = "0.1.0"
edition = "2021"
description = "Tiny Win32 GUI shell: embeds PyApp, opens a console for bootstrap, polls localhost:8080."
publish = false

[[bin]]
name = "AnkiImageUpdater"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
# Same glow as eframe (see Cargo.lock) so `App::on_exit` matches `Option<&glow::Context>`.
glow = "0.14.2"
sha2 = "0.10"
anyhow = "1.0"
msgbox = "0.7"
