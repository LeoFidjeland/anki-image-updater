[project]
name = "anki-image-updater"
version = "0.1.0"
description = "A GUI tool to update Anki cards with images from Pexels, Unsplash, Freepik, Pixabay, and Wikimedia Commons."
authors = [{name = "Leo Fidjeland", email = "leo@example.com"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "nicegui",
    "python-dotenv",
    "platformdirs",
    "httpx>=0.28.1",
]

[project.scripts]
anki-image-updater = "anki_image_updater:start_app"

[project.optional-dependencies]
test = [
    "pytest",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=1.2.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["anki_image_updater", "config_manager", "anki_client", "search_providers", "image_sizing", "core", "utils"]
