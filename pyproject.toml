[project]
name = "anki-image-updater"
version = "0.1.0"
description = "A GUI tool to update Anki cards with images from Pexels, Unsplash, and Freepik."
authors = [{name = "Leo Fidjeland", email = "leo@example.com"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "nicegui",
    "requests",
    "python-dotenv",
    "platformdirs",
]

[project.scripts]
anki-image-updater = "anki_image_updater:start_app"

[project.optional-dependencies]
test = [
    "pytest",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["anki_image_updater", "config_manager"]
